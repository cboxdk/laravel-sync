name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the engine package
        uses: actions/checkout@v4
        with:
          repository: cboxdk/sync
          path: ../sync

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer update --no-interaction --prefer-dist --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run tests
        run: vendor/bin/pest

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Check dependency licenses
        run: php bin/check-licenses.php

      - name: Check generated requirements
        run: |
          php bin/generate-requirements.php
          git diff --exit-code -- docs/requirements.md

  databases:
    name: ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sync
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: sync
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: sync
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the engine package
        uses: actions/checkout@v4
        with:
          repository: cboxdk/sync
          path: ../sync

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql, pdo_mysql
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests against ${{ matrix.database }}
        run: vendor/bin/pest
        env:
          SYNC_DRIVER: ${{ matrix.database == 'postgres' && 'pgsql' || 'mysql' }}
          SYNC_DATABASE: sync
          SYNC_HOST: 127.0.0.1
          SYNC_PORT: ${{ matrix.database == 'postgres' && '5432' || '3306' }}
          SYNC_USERNAME: ${{ matrix.database == 'postgres' && 'sync' || 'root' }}
          SYNC_PASSWORD: secret
